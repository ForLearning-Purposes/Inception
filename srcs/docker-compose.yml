services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    pull_policy: never
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # use absolute path and socket; allow more time for init
      test: ["CMD", "/usr/bin/mysqladmin", "ping", "-S", "/run/mysqld/mysqld.sock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    healthcheck:
      test: ["CMD", "php-fpm8.2", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    env_file: .env
    pull_policy: never
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "443:443"


volumes:
  mariadb_data:
  wordpress_data:

networks:
  inception:
    driver: bridge